databaseChangeLog:
  - changeSet:
      id: 36-player-presentation-deck
      author: bulba
      changes:
        - createTable:
            tableName: player_presentation_deck
            columns:
              - column:
                  name: player_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_player_presentation_deck_player
                    references: players(id)
                    deleteCascade: true
              - column:
                  name: slide_ids
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
