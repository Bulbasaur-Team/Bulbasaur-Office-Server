databaseChangeLog:
  - changeSet:
      id: 37-quantum-quiz-story
      author: bulba
      changes:
        - addColumn:
            tableName: quiz_topics
            columns:
              - column:
                  name: story
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addColumn:
            tableName: quiz_attempt
            columns:
              - column:
                  name: correct_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: |
              INSERT INTO quiz_topics (code, name, sort_order, story)
              VALUES ('quantum', 'Квантовая физика', 900, true)
              ON CONFLICT (code) DO UPDATE
              SET name = EXCLUDED.name, sort_order = EXCLUDED.sort_order, story = true;
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM quiz_questions WHERE topic_code = 'quantum';
              INSERT INTO quiz_questions (id, topic_code, text, options, correct_index) VALUES
              ('a1000001-0001-4000-8000-000000000001', 'quantum',
               'Что такое квант энергии?',
               '["Самая маленькая порция энергии", "Единица измерения офисного вайба", "Название нового мессенджера", "Пароль от холодильника"]'::jsonb, 0),
              ('a1000001-0001-4000-8000-000000000002', 'quantum',
               'Какой кот прославился в квантовой механике?',
               '["Кот Бегемот", "Кот Шрёдингера", "Офисный кот", "Чеширский кот"]'::jsonb, 1),
              ('a1000001-0001-4000-8000-000000000003', 'quantum',
               'Что обычно подразумевают под телепортацией?',
               '["Медленную доставку last mile", "Мгновенное перемещение из точки А в точку Б", "Zoom без камеры", "Пересылку слайдов в Slack"]'::jsonb, 1),
              ('a1000001-0001-4000-8000-000000000004', 'quantum',
               'Принцип неопределённости Гейзенберга: нельзя одновременно точно знать…',
               '["Логин и пароль", "Координату и импульс", "Дедлайн и скоуп", "Кто виноват и что делать"]'::jsonb, 1),
              ('a1000001-0001-4000-8000-000000000005', 'quantum',
               'Квантовая суперпозиция — это когда система…',
               '["Одновременно в нескольких состояниях до измерения", "Уже задеплоена в прод", "Спит в режиме энергосбережения", "Ждёт апрува от HR"]'::jsonb, 0),
              ('a1000001-0001-4000-8000-000000000006', 'quantum',
               'Спутанность частиц означает, что…',
               '["Они давно в одном чате", "Состояние одной связано с состоянием другой", "Их нельзя разделить по отделам", "Они всегда летят в одну сторону"]'::jsonb, 1),
              ('a1000001-0001-4000-8000-000000000007', 'quantum',
               'Фотон — это…',
               '["Частица света", "Вид корпоративного стикера", "Новый эмодзи в Bulba Talk", "Единица Bulba Coin"]'::jsonb, 0),
              ('a1000001-0001-4000-8000-000000000008', 'quantum',
               'Почему квантовый компьютер считают «другим»?',
               '["Он работает на Comic Sans", "Использует суперпозицию и запутанность", "У него зелёные дашборды", "Он сам пишет презентации"]'::jsonb, 1),
              ('a1000001-0001-4000-8000-000000000009', 'quantum',
               'Если открыть коробку с котом Шрёдингера, то…',
               '["Кот всегда жив", "Кот всегда мёртв", "Состояние определяется в момент наблюдения", "Кот получает ачивку"]'::jsonb, 2),
              ('a1000001-0001-4000-8000-00000000000a', 'quantum',
               'Что из этого ближе всего к офисной «мгновенной доставке»?',
               '["Телепорт", "Пешая доставка за 3 дня", "Статус «концептуально зелёный»", "Письмо «как дела по задаче?»"]'::jsonb, 0),
              ('a1000001-0001-4000-8000-00000000000b', 'quantum',
               'Можно ли идеально скопировать неизвестное квантовое состояние?',
               '["Да, Ctrl+C / Ctrl+V", "Нет, есть теорема о запрете клонирования", "Да, если попросить Claude", "Только в выходные"]'::jsonb, 1),
              ('a1000001-0001-4000-8000-00000000000c', 'quantum',
               'Что делает измерение с волновой функцией в учебниках?',
               '["Отправляет её в отпуск", "«Схлопывает» к одному исходу", "Удваивает зарплату", "Включает тихий режим"]'::jsonb, 1);
