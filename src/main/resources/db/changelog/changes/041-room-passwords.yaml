databaseChangeLog:
  - changeSet:
      id: 41-room-passwords
      author: bulba
      comment: >
        Пароль комнаты poker/retro хранится bcrypt-хэшем. Пустой хэш — комната
        открыта. Список допущенных действует только для закрытых комнат.
        Уже существующим комнатам задаётся один и тот же хэш, а в допущенные
        попадают админ и те, кто оставил след в комнате (голоса, стикеры,
        настроение, мемы, реакции).
      changes:
        - addColumn:
            tableName: poker_rooms
            columns:
              - column:
                  name: password_hash
                  type: varchar(60)
        - addColumn:
            tableName: retro_rooms
            columns:
              - column:
                  name: password_hash
                  type: varchar(60)
        - createTable:
            tableName: poker_room_members
            columns:
              - column:
                  name: room_id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_poker_room_members
                    foreignKeyName: fk_poker_room_members_room
                    references: poker_rooms(id)
                    deleteCascade: true
              - column:
                  name: player_id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_poker_room_members
                    foreignKeyName: fk_poker_room_members_player
                    references: players(id)
                    deleteCascade: true
              - column:
                  name: granted_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: poker_room_members
            indexName: idx_poker_room_members_player
            columns:
              - column:
                  name: player_id
        - createTable:
            tableName: retro_room_members
            columns:
              - column:
                  name: room_id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_retro_room_members
                    foreignKeyName: fk_retro_room_members_room
                    references: retro_rooms(id)
                    deleteCascade: true
              - column:
                  name: player_id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_retro_room_members
                    foreignKeyName: fk_retro_room_members_player
                    references: players(id)
                    deleteCascade: true
              - column:
                  name: granted_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: retro_room_members
            indexName: idx_retro_room_members_player
            columns:
              - column:
                  name: player_id
        - sql:
            sql: |
              UPDATE poker_rooms
              SET password_hash = '$2a$10$WTsf8bCIuAx0RXyLQbh.YO/dO7XHoRzQewilFAbvP2KeAZXtV0X/G'
              WHERE password_hash IS NULL;
              UPDATE retro_rooms
              SET password_hash = '$2a$10$WTsf8bCIuAx0RXyLQbh.YO/dO7XHoRzQewilFAbvP2KeAZXtV0X/G'
              WHERE password_hash IS NULL;

              INSERT INTO poker_room_members (room_id, player_id, granted_at)
              SELECT id, admin_player_id, now() FROM poker_rooms
              ON CONFLICT DO NOTHING;

              INSERT INTO poker_room_members (room_id, player_id, granted_at)
              SELECT DISTINCT t.room_id, v.player_id, now()
              FROM poker_votes v
              JOIN poker_tasks t ON t.id = v.task_id
              WHERE t.room_id IS NOT NULL
              ON CONFLICT DO NOTHING;

              INSERT INTO retro_room_members (room_id, player_id, granted_at)
              SELECT id, admin_player_id, now() FROM retro_rooms
              ON CONFLICT DO NOTHING;

              INSERT INTO retro_room_members (room_id, player_id, granted_at)
              SELECT room_id, player_id, now() FROM retro_moods
              ON CONFLICT DO NOTHING;

              INSERT INTO retro_room_members (room_id, player_id, granted_at)
              SELECT DISTINCT room_id, author_id, now() FROM retro_stickers
              ON CONFLICT DO NOTHING;

              INSERT INTO retro_room_members (room_id, player_id, granted_at)
              SELECT DISTINCT room_id, author_id, now() FROM retro_memes
              ON CONFLICT DO NOTHING;

              INSERT INTO retro_room_members (room_id, player_id, granted_at)
              SELECT DISTINCT s.room_id, r.player_id, now()
              FROM retro_reactions r
              JOIN retro_stickers s ON s.id = r.target_id
              WHERE r.target_type = 'sticker'
              ON CONFLICT DO NOTHING;

              INSERT INTO retro_room_members (room_id, player_id, granted_at)
              SELECT DISTINCT m.room_id, r.player_id, now()
              FROM retro_reactions r
              JOIN retro_memes m ON m.id = r.target_id
              WHERE r.target_type = 'meme'
              ON CONFLICT DO NOTHING;
